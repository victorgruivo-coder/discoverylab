services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discoverylab
      POSTGRES_PASSWORD: discoverylab
      POSTGRES_DB: discoverylab
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discoverylab -d discoverylab']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
